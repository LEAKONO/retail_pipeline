version: 2

models:
  - name: dim_date
    description: "Calendar dimension. One row per date."
    columns:
      - name: date_id
        description: "Integer date key YYYYMMDD"
        tests:
          - not_null
          - unique
      - name: full_date
        description: "Full date value"
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension. One row per customer."
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique
      - name: country
        description: "Customer country"
        tests:
          - not_null
      - name: customer_segment
        description: "VIP, LOYAL, REGULAR, or NEW"
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension. One row per product."
    columns:
      - name: stock_code
        description: "Unique product stock code"
        tests:
          - not_null
          - unique
      - name: description
        description: "Product description"
        tests:
          - not_null

  - name: fct_orders
    description: "Orders fact table. One row per order line item."
    columns:
      - name: order_key
        description: "Surrogate primary key"
        tests:
          - not_null
          - unique
      - name: invoice_no
        description: "Invoice number"
        tests:
          - not_null
      - name: date_id
        description: "Foreign key to dim_date"
        tests:
          - not_null
      - name: quantity
        description: "Quantity ordered"
        tests:
          - not_null
      - name: line_total
        description: "Gross line total"
        tests:
          - not_null
